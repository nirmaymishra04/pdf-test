<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyRWH - Water Security Assessment & PDF Report</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      color: #38bdf8;
    }

    .container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      flex: 1;
      height: calc(100vh - 70px);
    }

    .panel {
      background-color: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
    }

    input, select {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .summary-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 0.85rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .summary-card strong {
      color: #38bdf8;
    }

    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: auto;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    .preview-panel {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder {
      text-align: center;
      color: #64748b;
      padding: 2rem;
    }

    .status-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-idle { background-color: #334155; color: #cbd5e1; }
    .status-loading { background-color: #854d0e; color: #fef08a; }
    .status-success { background-color: #14532d; color: #bbf7d0; }
    .status-error { background-color: #7f1d1d; color: #fecaca; }
  </style>
</head>
<body>

  <header>
    <h1>EasyRWH - Technical Assessment Generator</h1>
    <span id="status" class="status-badge status-idle">Ready</span>
  </header>

  <div class="container">
    <div class="panel">
      <h2 class="panel-title">Assessment Parameters</h2>

      <div class="form-group">
        <label for="apiUrl">API Endpoint</label>
        <input type="text" id="apiUrl" value="http://localhost:3000/reports/feasibility">
      </div>

      <div class="form-group">
        <label for="locationName">Property Location</label>
        <input type="text" id="locationName" value="Sector 62, Noida, UP">
      </div>

      <div class="form-group">
        <label for="rooftopArea">Rooftop Area (sq. ft.)</label>
        <input type="number" id="rooftopArea" value="2400">
      </div>

      <div class="form-group">
        <label for="annualHarvest">Est. Annual Harvest (Liters)</label>
        <input type="number" id="annualHarvest" value="185000">
      </div>

      <div class="summary-card">
        <p><strong>System Auto-Recommendations:</strong></p>
        <p>• Modular Filtration Pit ($450)</p>
        <p>• First Flush Diverter ($120)</p>
      </div>

      <button id="submitBtn" onclick="generatePdf()">Generate Technical PDF</button>
    </div>

    <div class="preview-panel">
      <div id="placeholder" class="placeholder">
        <p>Select your assessment criteria and click <strong>"Generate Technical PDF"</strong> to render the report preview.</p>
      </div>
      <iframe id="pdfFrame" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    async function generatePdf() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const locationName = document.getElementById('locationName').value.trim();
      const rooftopAreaSqFt = Number(document.getElementById('rooftopArea').value);
      const estimatedAnnualHarvestLiters = Number(document.getElementById('annualHarvest').value);

      const statusBadge = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const placeholder = document.getElementById('placeholder');
      const iframe = document.getElementById('pdfFrame');

      // Construct JSON payload internally from simple form inputs
      const payload = {
        locationName: locationName,
        rooftopAreaSqFt: rooftopAreaSqFt,
        estimatedAnnualHarvestLiters: estimatedAnnualHarvestLiters,
        recommendations: [
          {
            structureType: "Modular Filtration Pit",
            estimatedCost: 450,
            impactLevel: "High (Direct Recharge)"
          },
          {
            structureType: "First Flush Diverter",
            estimatedCost: 120,
            impactLevel: "Medium (Water Quality)"
          }
        ]
      };

      // UI Loading State
      statusBadge.className = 'status-badge status-loading';
      statusBadge.textContent = 'Generating PDF...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
        }

        const blob = await response.blob();
        const pdfUrl = URL.createObjectURL(blob);

        iframe.src = pdfUrl;
        iframe.style.display = 'block';
        placeholder.style.display = 'none';

        statusBadge.className = 'status-badge status-success';
        statusBadge.textContent = 'Success (200 OK)';
      } catch (error) {
        alert('Request Failed: ' + error.message);
        statusBadge.className = 'status-badge status-error';
        statusBadge.textContent = 'Request Failed';
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
